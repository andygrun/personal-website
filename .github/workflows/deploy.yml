name: Deploy Website

on:
  push:
    branches:
      - main

jobs: 
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t personal-website .

      - name: Stop old container
        run: docker stop personal-website || true

      - name: Remove old container
        run: docker rm personal-website || true

      - name: Start new container
        run: docker run -d -p 8080:80 --name personal-website personal-website